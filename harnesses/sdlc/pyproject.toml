[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sdlc"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "anthropic>=0.40",
    "openai>=1.50",
    "google-genai>=1.0",
    "rich>=13.0",
    "jinja2>=3.1",
]

[project.scripts]
sdlc = "sdlc.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sdlc = ["prompts/*.md"]
